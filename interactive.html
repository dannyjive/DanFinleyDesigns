      <div class="container">
        <a class="navbar-brand eczarh1" href="index.html">dan finley designs</a>

        <!-- Hamburger Menu -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"> </span>
        </button>

        <!-- Nav Menu -->
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarSupportedContent"
        >
          <ul class="navbar-nav mr-auto">
            <li class="nav-item">

          </ul>
        </div>

    <!-- MAIN -->
    <main class="container flex-grow-1">
      <!-- Row One -->
      <div class="row mt-5">
        <!-- Padding Column -->
        <div class="col"></div>

        <!-- Central Columns Containing Cards -->

        <!-- Rive Walk Cycle -->
        <div class="col-md-3 mb-3">
          <div class="card mt-5 fade-in">
            <div class="card-body">
              <h5 class="card-title text-center">hover state</h5>
              <!-- RIVE CANVAS -->
              <canvas id="canvas" width="165" height="165"></canvas>

              <!-- RIVE PACKAGE SCRIPT -->
              <script src="https://unpkg.com/@rive-app/canvas"></script>

              <!-- RIVE FILES -->
              <script>
                const r = new rive.Rive({
                  src: "./img/rive/walkcycle.riv",
                  // src: "https://cdn.rive.app/animations/vehicles.riv",
                  canvas: document.getElementById("canvas"),
                  autoplay: true,

                  stateMachines: "Walking",

                  onLoad: () => {
                    r.resizeDrawingSurfaceToCanvas();
                  },
                });
              </script>
            </div>
          </div>
        </div>
        <!-- Card - Kid Comics -->
        <div class="col-md-3 mb-3">
          <div class="card mt-5 fade-in">
            <div
              class="card-body"
              id="kidCard"
              data-bs-toggle="modal"
              data-bs-target="#kidModal"
            >
              <!-- data-bs-target points to modal ID -->
              <h5 class="card-title text-center">children's comics</h5>

              <img
                src="img/comics/kid/octo/Octo_thumb.jpg"
                class="card-img-top"
                alt="kids comics thumbnail"
              />
            </div>
          </div>
        </div>

        <!-- Card - Mainstream Comics -->
        <div class="col-md-3 mb-3">
          <div class="card mt-5">
            <div
              class="card-body"
              id="mainstreamCard"
              data-bs-toggle="modal"
              data-bs-target="#mainstreamModal"
            >
              <!-- data-bs-target points to modal ID -->
              <h5 class="card-title text-center card-thumbnail">
                mainstream comics
              </h5>
              <img
                src="img/comics/mainstream/gothamKnights/GothamKnights_thumb.jpg"
                class="card-img-top"
                alt="mainstream comics thumbnail"
              />
            </div>
          </div>
        </div>

        <!-- Padding Column -->
        <div class="col"></div>
      </div>
      <!-- End of Row One-->

      <div class="container"></div>
    </main>

    <!-- FOOTER -->
    <footer class="container">
      <div class="row">
        <div class="col"></div>
        <div class="col-lg-10 my-3 text-center">
          <p id="copyright"></p>
        </div>
        <div class="col"></div>
      </div>
    </footer>

    <!-- SCRIPT -->
    <!-- GSAP Library -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <!-- Import gsap.js -->
    <script src="./js/gsapScripts.js"></script>

    <!-- Import scripts.js -->
    <script src="./js/script.js"></script>

    <!-- BOOTSTRAP SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
